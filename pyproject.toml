[project]
name = "tp-project"
version = "0.1.0"
description = ""
authors = [
    {name = "avolxn",email = "vlad.eldashov2303@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "uvicorn[standard] (>=0.38.0,<0.39.0)",
    "fastapi (>=0.120.0,<0.121.0)",
    "pydantic-settings (>=2.11.0,<3.0.0)",
    "httpx (>=0.28.0,<0.29.0)",
    "redis (>=5.0.0,<6.0.0)"
]

[tool.poetry]
packages = [{include = "tp_project", from = "src"}]


[tool.poetry.group.dev.dependencies]
ipykernel = "^7.0.1"
ruff = "^0.14.2"
pre-commit = "^3.8.0"
pytest = "^8.0.0"
httpx = "^0.28.0"
pytest-mock = "^3.12.0"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C", "UP", "S"]
ignore = ["E501", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
